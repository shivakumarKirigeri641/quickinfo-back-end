# ---------------------------------------------------------------------------
# QuickInfo — Nginx for two hosts on one box.
#
#   quickinfo.in, www.quickinfo.in   static  website (quickinfo-front-end/dist)
#   api.quickinfo.in                 proxy   Node on 127.0.0.1:7788
#
# Install:
#   sudo cp deploy/nginx-quickinfo.conf /etc/nginx/sites-available/quickinfo
#   sudo ln -s /etc/nginx/sites-available/quickinfo /etc/nginx/sites-enabled/quickinfo
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS (certbot rewrites these blocks and adds the 443 servers):
#   sudo certbot --nginx -d quickinfo.in -d www.quickinfo.in -d api.quickinfo.in
#
# Run certbot only AFTER all three DNS A records point at this server.
# ---------------------------------------------------------------------------

# --- public website --------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name quickinfo.in www.quickinfo.in;
    root /var/www/quickinfo-site;
    index index.html;

    # Single-page app: /privacy-policy etc. render the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so they can be cached hard and for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves visitors on the old
    # bundle pointing at asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# --- API -------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.quickinfo.in;

    # The API only accepts small JSON bodies (20kb in app.js).
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:7788;
        proxy_http_version 1.1;

        # app.js sets "trust proxy", so these headers decide the client IP the
        # rate limiter and the contact log see. They must be set here.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    add_header X-Robots-Tag "noindex, nofollow" always;
}
